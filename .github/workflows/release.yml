name: Build and Release Windows Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pywin32 httpx pyinstaller

      - name: Build Fast Directory Package with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "WTranslator" `
            --add-data "version.json;." `
            --hidden-import "win32com.client" `
            --hidden-import "pythoncom" `
            --hidden-import "win32clipboard" `
            main.py
          Copy-Item "version.json" "dist/WTranslator/version.json" -Force
          Copy-Item "install.bat" "dist/WTranslator/install.bat" -Force
          Compress-Archive -Path "dist/WTranslator/*" -DestinationPath "dist/WTranslator-Windows-Setup.zip" -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WTranslator-Windows-Setup
          path: dist/WTranslator-Windows-Setup.zip

      - name: Publish to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WTranslator-Windows-Setup.zip
          generate_release_notes: true
